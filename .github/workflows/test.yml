name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # MotherDuck only serves its extension for supported DuckDB versions: bump this when it drops one.
      - name: Download the DuckDB JDBC driver
        run: curl -sSfo duckdb_jdbc.jar https://repo1.maven.org/maven2/org/duckdb/duckdb_jdbc/1.5.5.0/duckdb_jdbc-1.5.5.0.jar

      # Builds the connection like Tableau does and uses it. The SQL dialect is only covered by TDVT,
      # which needs Tableau Desktop.
      - name: Connect to an in-memory database through the connector's URL and properties
        run: node testing/smoke/connection.mjs memory | java -cp duckdb_jdbc.jar testing/smoke/Smoke.java

      - name: Connect to MotherDuck through the connector's URL and properties
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          node testing/smoke/connection.mjs motherduck sample_data "$MOTHERDUCK_TOKEN" \
            | java -cp duckdb_jdbc.jar testing/smoke/Smoke.java
