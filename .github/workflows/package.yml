name: Package DuckDB Taco

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout MotherDuck Tableau connector
      uses: actions/checkout@v4
      with:
        path: taco

    - name: Checkout SDK
      uses: actions/checkout@v4
      with:
        repository: tableau/connector-plugin-sdk
        path: sdk
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Create Virtual Environment
      working-directory: ./sdk
      run: python -m venv .venv

    - name: Package Taco
      working-directory: ./sdk
      run: |
        source .venv/bin/activate
        cd connector-packager
        python setup.py install
        python -m connector_packager.package ../../taco/tableau_connectors/duckdb_jdbc

    - name: Upload Taco
      uses: actions/upload-artifact@v4
      with:
        name: duckdb_taco
        path: |
          sdk/connector-packager/packaged-connector/duckdb_jdbc*.taco

    - name: Upload Connector
      uses: actions/upload-artifact@v4
      with:
        name: duckdb_jdbc
        path: |
          taco/tableau_connectors/duckdb_jdbc
